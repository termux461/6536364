name: Android build

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download prebuilt libv2ray.aar
        # Building AndroidLibXrayLite from source via gomobile hits an unresolved upstream
        # incompatibility (github.com/wlynxg/anet fails to link under every combination of Go
        # version, target ABI, and NDK version tried). v2rayNG itself doesn't build it from
        # source either - it downloads the prebuilt .aar that 2dust/AndroidLibXrayLite already
        # publishes as a GitHub Release asset, so we do the same.
        uses: robinraju/release-downloader@v1
        with:
          repository: "2dust/AndroidLibXrayLite"
          latest: true
          fileName: "libv2ray.aar"
          out-file-path: "app/libs"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lc-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
