name: Android build

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build libv2ray.aar (gomobile bind against AndroidLibXrayLite)
        run: |
          # `go install .../gomobile@latest` may need a newer Go than actions/setup-go gave us -
          # let GOTOOLCHAIN=auto fetch whatever that install needs, same as any other `go install`.
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

          git clone --depth=1 https://github.com/2dust/AndroidLibXrayLite.git /tmp/AndroidLibXrayLite
          cd /tmp/AndroidLibXrayLite
          mkdir -p "$GITHUB_WORKSPACE/app/libs"

          # But pin the actual target build back to exactly the Go version actions/setup-go
          # installed, whatever that auto-fetch above pulled in for the gomobile/gobind install
          # itself. A previous run's toolchain drifted to a newer Go here and broke
          # github.com/wlynxg/anet ("invalid reference to net.zoneCache", a go:linkname hack
          # into a private net package symbol that not every Go version supports).
          export GOTOOLCHAIN=go1.22.12
          gomobile bind -v -androidapi 24 -target=android -o "$GITHUB_WORKSPACE/app/libs/libv2ray.aar" .

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lc-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
