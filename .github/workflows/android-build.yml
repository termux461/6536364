name: Android build

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build libv2ray.aar (gomobile bind against AndroidLibXrayLite)
        run: |
          # `gomobile@latest` currently requires Go >= 1.25, which breaks
          # github.com/wlynxg/anet (a go:linkname hack into net.zoneCache that Go 1.25 no longer
          # allows) - and anet's last release (v0.0.5, 2024-10-04) predates any fix for that, so
          # bumping the dependency isn't an option. Pinning gomobile/gobind instead to the last
          # commit whose go.mod still only requires go 1.22 (found via `git log -- go.mod` on
          # github.com/golang/mobile) avoids the whole Go 1.25 code path. That go.mod's
          # `godebug` directive still needs a parser newer than 1.22 itself to read (1.22 errors
          # with "unknown directive: godebug"), so setup-go above is 1.23 - newer than the
          # module's own stated minimum, still short of the 1.25 that breaks anet.
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250218170336-ba142f8e7d3c
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250218170336-ba142f8e7d3c
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

          git clone --depth=1 https://github.com/2dust/AndroidLibXrayLite.git /tmp/AndroidLibXrayLite
          cd /tmp/AndroidLibXrayLite
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          gomobile bind -v -androidapi 24 -target=android -o "$GITHUB_WORKSPACE/app/libs/libv2ray.aar" .

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lc-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
