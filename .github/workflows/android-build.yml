name: Android build

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build libv2ray.aar (gomobile bind against AndroidLibXrayLite)
        run: |
          # github.com/wlynxg/anet's go:linkname hack into net.zoneCache fails to link
          # ("invalid reference to net.zoneCache") - identically under Go 1.22, 1.23, and
          # whatever 1.25 gomobile@latest pulled in, which rules out Go version as the cause
          # (that was the working theory for several rounds; it wasn't it). `gomobile bind`
          # builds one Android ABI at a time and aborts on the first failure, and the one
          # visible failing ABI so far is armeabi-v7a (32-bit ARM) - so this round tests
          # whether it's arch-specific by building only android/arm64 (which covers effectively
          # all real devices anyway) instead of the default all-ABI `-target=android`.
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250210185054-b38b8813d607
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250210185054-b38b8813d607
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

          git clone --depth=1 https://github.com/2dust/AndroidLibXrayLite.git /tmp/AndroidLibXrayLite
          cd /tmp/AndroidLibXrayLite
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          gomobile bind -v -androidapi 24 -target=android/arm64 -o "$GITHUB_WORKSPACE/app/libs/libv2ray.aar" .

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lc-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
