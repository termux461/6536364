name: Android build

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          # r26's bundled lld is the one remaining untested variable in the anet link failure -
          # Go version and target ABI are both ruled out now (identical failure on 1.22/1.23/1.25
          # and on both armeabi-v7a and arm64-v8a). Trying the older r25c LTS line instead.
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build libv2ray.aar (gomobile bind against AndroidLibXrayLite)
        run: |
          # github.com/wlynxg/anet's go:linkname hack into net.zoneCache fails to link
          # ("invalid reference to net.zoneCache") identically under Go 1.22/1.23/1.25 and on
          # both armeabi-v7a and arm64-v8a - ruling out both Go version and target ABI as the
          # cause. Only NDK version (r26's lld) is left untested; see the NDK install step above.
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250210185054-b38b8813d607
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250210185054-b38b8813d607
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

          git clone --depth=1 https://github.com/2dust/AndroidLibXrayLite.git /tmp/AndroidLibXrayLite
          cd /tmp/AndroidLibXrayLite
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          gomobile bind -v -androidapi 24 -target=android/arm64 -o "$GITHUB_WORKSPACE/app/libs/libv2ray.aar" .

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lc-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
