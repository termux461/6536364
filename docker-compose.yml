services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  bot:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "bot.main"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - webapp_uploads:/app/webapp/uploads

  webapp-api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "webapp.api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - webapp_uploads:/app/webapp/uploads
    expose:
      - "8001"

  panel:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "panel.main:app", "--host", "0.0.0.0", "--port", "8002"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - webapp_uploads:/app/webapp/uploads
    expose:
      - "8002"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - webapp-api
      - panel

volumes:
  postgres_data:
  redis_data:
  webapp_uploads:
