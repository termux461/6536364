services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rwbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rwbot}
      POSTGRES_DB: ${POSTGRES_DB:-rwbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rwbot} -d ${POSTGRES_DB:-rwbot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.main"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.workers.deployment_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # A trivially-passing check would report a crashed worker as healthy. Ping Redis with
      # the same library and URL the worker itself uses.
      test:
        - CMD
        - python
        - -c
        - |
          import asyncio, os
          from redis.asyncio import Redis
          async def main():
              client = Redis.from_url(os.environ["REDIS_URL"])
              await client.ping()
              await client.aclose()
          asyncio.run(main())
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  broadcast:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.workers.broadcast_worker"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  redisdata:
